# 上游镜像发新版时开 PR，标签和摘要一起改；PR 跑插件自己的检查。
version: 2
updates:
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: daily
    # 三个 Penpot 服务必须一起升级，避免前后端版本不一致。
    groups:
      penpot:
        patterns: ["penpotapp/*"]
    # 数据库跨大版本会让旧数据目录起不来（要 pg_upgrade 或导出导入手动迁移），不让 Dependabot 自动开。
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: valkey/valkey
        update-types: ["version-update:semver-major"]
